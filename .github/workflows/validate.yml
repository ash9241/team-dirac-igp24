name: Validate archive
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: |
          python -m pip install -r requirements-test.txt
          sudo apt-get update -qq
          sudo apt-get install -y pari-gp
      - name: Validate data and reader links
        run: python scripts/validate_release.py
      - name: Reconstruct the F5 example
        run: python examples/f5/replay_example.py --gp gp
      - name: Check mathematical helpers and harness
        working-directory: research
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest
          tests/test_pair_product_resolvent.py
          tests/test_nested_character_lift.py
          tests/test_unit_character_lift.py
          tests/test_ledger.py
          tests/test_scheduler.py
          tests/test_api_client.py
          tests/test_controller.py -q
